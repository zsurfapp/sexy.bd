<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0c29" />
  <meta name="robots" content="noindex, nofollow" />
  <title>sexy.bd</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-1: #0f0c29; --bg-2: #302b63; --bg-3: #24243e;
      --accent: #e34449; --accent-2: #ee0979;
      --text: #fff; --muted: #888;
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.12);
      --line: rgba(255, 255, 255, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      background: rgba(15, 12, 41, 0.7);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 18px;
    }
    .logo {
      font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -1px;
      text-decoration: none;
    }
    .search { flex: 1; max-width: 540px; position: relative; }
    .search input {
      width: 100%; padding: 10px 14px 10px 38px;
      border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05); color: var(--text);
      font-size: 0.95rem; outline: none; transition: border-color .2s;
    }
    .search input:focus { border-color: var(--accent); }
    .search::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: 0.9rem; opacity: 0.6;
    }
    main { max-width: 1400px; margin: 0 auto; padding: 28px 20px 60px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px;
    }
    .card {
      position: relative; background: var(--card);
      border-radius: 10px; overflow: hidden; cursor: pointer;
      transition: transform .25s ease, background .25s ease;
      aspect-ratio: 16 / 9; border: 1px solid transparent;
    }
    .card:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent); }
    .card img {
      width: 100%; height: 100%; object-fit: cover; background: #000; display: block;
    }
    .card .duration {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(0, 0, 0, 0.75); color: var(--text);
      font-size: 0.72rem; padding: 3px 7px; border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .card .play-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.35); opacity: 0; transition: opacity .2s;
      font-size: 3rem; pointer-events: none;
    }
    .card:hover .play-icon { opacity: 1; }
    .card .title-bar {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 28px 10px 8px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.85));
      font-size: 0.78rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transition: opacity .2s;
    }
    .card:hover .title-bar { opacity: 1; }

    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92);
      z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-content { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 12px; }
    .modal video { width: 100%; max-height: 80vh; background: #000; border-radius: 8px; }
    .modal .close {
      position: absolute; top: 14px; right: 14px;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15); border: none; color: var(--text);
      font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal .close:hover { background: rgba(255, 255, 255, 0.25); }

    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 80px 20px; color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      padding: 80px 20px; text-align: center; color: var(--muted);
    }
    footer {
      border-top: 1px solid var(--line); padding: 20px;
      text-align: center; font-size: 0.8rem; color: var(--muted);
    }
    @media (max-width: 600px) {
      header { padding: 10px 14px; gap: 10px; }
      .logo { font-size: 1.3rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .modal { padding: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">sexy.bd</a>
    <div class="search">
      <input id="q" type="search" placeholder="Search…" autocomplete="off" />
    </div>
  </header>

  <main>
    <div id="grid" class="grid">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </main>

  <footer></footer>

  <div id="modal" class="modal" aria-hidden="true">
    <button class="close" aria-label="Close">×</button>
    <div class="modal-content">
      <video id="player" controls preload="metadata" playsinline></video>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // Worker URL — embedded; not user-replaceable
    const WORKER = 'https://sexy-cdn-proxy.biplob420vai.workers.dev';
    const state = { videos: [], view: [] };

    function fmtDur(sec) {
      if (!sec) return '';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
    }

    function bucketOf(id) { return Math.floor(parseInt(id, 10) / 1000) * 1000; }

    // Thumbnail URLs — high quality
    function thumb(v) {
      const b = bucketOf(v.id);
      return `${WORKER}/t/${b}/${v.id}/hd/1.jpg`;
    }
    function thumbStd(v) {
      const b = bucketOf(v.id);
      return `${WORKER}/t/${b}/${v.id}/640x360/1.jpg`;
    }

    async function load() {
      try {
        const r = await fetch(`${WORKER}/m?_=${Date.now()}`);
        if (!r.ok) throw new Error('load failed');
        const d = await r.json();
        state.videos = Array.isArray(d.videos) ? d.videos : [];
        state.view = state.videos.slice().sort((a, b) => parseInt(b.id) - parseInt(a.id));
        render();
      } catch (e) {
        document.getElementById('grid').innerHTML = '<div class="empty">No videos available.</div>';
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      const list = state.view;
      if (!list.length) {
        grid.innerHTML = '<div class="empty">No videos match.</div>';
        return;
      }
      grid.innerHTML = list.map((v, i) => `
        <div class="card" data-i="${i}">
          <img src="${thumb(v)}" loading="lazy" referrerpolicy="no-referrer"
               onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${thumbStd(v)}'}" />
          ${v.duration ? `<div class="duration">${fmtDur(v.duration)}</div>` : ''}
          <div class="play-icon">▶</div>
          <div class="title-bar">${(v.title || '').replace(/</g,'&lt;')}</div>
        </div>
      `).join('');
      grid.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
          openModal(list[+card.dataset.i]);
        });
      });
    }

    function openModal(v) {
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      const url = `${WORKER}/v/${v.id}.mp4`;
      player.src = url;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      player.play().catch(() => {});
    }
    function closeModal() {
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      player.pause(); player.removeAttribute('src'); player.load();
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.querySelector('.modal .close').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // Search (client-side only, no network)
    let st;
    document.getElementById('q').addEventListener('input', (e) => {
      clearTimeout(st);
      const q = e.target.value.trim().toLowerCase();
      st = setTimeout(() => {
        state.view = state.videos
          .filter(v => !q || (v.title && v.title.toLowerCase().includes(q)))
          .sort((a, b) => parseInt(b.id) - parseInt(a.id));
        render();
      }, 180);
    });

    load();
  })();
  </script>
</body>
</html>
