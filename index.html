  <style>
    :root {
      --bg-1: #0a0a14;
      --accent: #ff2d6e;
      --text: #f5f5fa;
      --muted: #7c7c95;
      --line: rgba(255, 255, 255, 0.08);
      --card: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.10);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-1);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(200, 34, 255, 0.08), transparent 70%),
        radial-gradient(ellipse 80% 50% at 80% 100%, rgba(255, 45, 110, 0.06), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      background: rgba(10, 10, 20, 0.7);
      border-bottom: 1px solid var(--line);
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .search { position: relative; width: 100%; max-width: 560px; }
    .search input {
      width: 100%; padding: 14px 18px 14px 46px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 4px rgba(255, 45, 110, 0.15);
    }
    .search .icon {
      position: absolute; left: 18px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--muted);
      pointer-events: none;
    }
    .search .clear {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      width: 26px; height: 26px;
      border: none; background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer; display: none;
      align-items: center; justify-content: center;
      font-size: 16px; line-height: 1;
      transition: background .2s, color .2s;
    }
    .search .clear:hover { background: rgba(255, 255, 255, 0.12); color: var(--text); }
    .search.has-value .clear { display: flex; }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      position: relative;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s cubic-bezier(.2,.8,.2,1), background .25s, box-shadow .25s;
      aspect-ratio: 16 / 9;
      border: 1px solid transparent;
      box-shadow: var(--shadow);
    }
    .card:hover {
      transform: translateY(-4px) scale(1.02);
      background: var(--card-hover);
      border-color: rgba(255, 45, 110, 0.3);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 45, 110, 0.2);
    }
    .card img {
      width: 100%; height: 100%;
      object-fit: cover; background: #000; display: block;
      transition: transform .35s cubic-bezier(.2,.8,.2,1);
    }
    .card:hover img { transform: scale(1.04); }
    .card .duration {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .card .play-icon {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, transparent 70%);
      opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .card .play-icon svg { width: 56px; height: 56px; fill: white; filter: drop-shadow(0 2px 12px rgba(0,0,0,0.5)); }
    .card:hover .play-icon { opacity: 1; }
    .card .title-bar {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 32px 10px 10px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.85));
      font-size: 0.82rem; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transition: opacity .2s;
      letter-spacing: 0.01em;
    }
    .card:hover .title-bar { opacity: 1; }

    /* Ad slot — full-width inline banner */
    .ad-slot {
      grid-column: 1 / -1;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .ad-slot > div[id^="container-"] {
      width: 100%;
      min-height: 60px;
    }

    /* === Video player — uses native Fullscreen API for immersive experience === */
    /* Note: Browsers may show brief overlay ("Press ESC to exit", "Drag down to exit")
       when entering native fullscreen — this is browser-controlled UX and cannot
       be suppressed via web code. We accept this in exchange for true fullscreen. */
    video.player {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 9999;
      object-fit: contain;
      cursor: pointer;
      display: none;
    }
    video.player.active { display: block; }

    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 120px 20px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      padding: 100px 20px; text-align: center;
      color: var(--muted); font-size: 0.95rem;
    }

    footer { display: none; }

    @media (max-width: 600px) {
      .topbar { padding: 12px 16px; }
      main { padding: 20px 14px 60px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="search" id="searchWrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search videos…" autocomplete="off" spellcheck="false" />
      <button class="clear" id="clearBtn" type="button" aria-label="Clear">×</button>
    </div>
  </div>

  <main>
    <div id="grid" class="grid">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </main>

  <video id="player" class="player" controls preload="metadata" playsinline referrerpolicy="no-referrer"></video>

  <script>
  (function() {
    'use strict';

    const WORKER = 'https://sexy-cdn-proxy.biplob420vai.workers.dev';
    const state = { videos: [], view: [] };
    const searchWrap = document.getElementById('searchWrap');
    const searchInput = document.getElementById('q');
    const clearBtn = document.getElementById('clearBtn');
    const player = document.getElementById('player');

    function fmtDur(sec) {
      if (!sec) return '';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
    }

    function bucketOf(id) { return Math.floor(parseInt(id, 10) / 1000) * 1000; }

    function thumb(v) {
      const b = bucketOf(v.id);
      return `${WORKER}/t/${b}/${v.id}/hd/1.jpg`;
    }
    function thumbStd(v) {
      const b = bucketOf(v.id);
      return `${WORKER}/t/${b}/${v.id}/640x360/1.jpg`;
    }

    function playIconSVG() {
      return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    }

    // Note: We do NOT use the native Fullscreen API here on purpose.
    // Browsers (Chrome, Safari, mobile) display intrusive overlay messages
    // ("Press ESC to exit fullscreen", "Drag down to exit") when Fullscreen API
    // is invoked. Instead, we simulate fullscreen using a fixed-position
    // video element that fills the viewport — visually identical to native
    // fullscreen but without any browser-controlled toasts or gestures.

    function playVideo(v) {
      const url = `${WORKER}/v/${v.id}.mp4`;
      player.src = url;
      player.classList.add('active');
      player.muted = false;
      // Try native fullscreen first (immersive), fall back to CSS-based if denied
      const fsFn = player.requestFullscreen
                || player.webkitRequestFullscreen
                || player.mozRequestFullScreen
                || player.msRequestFullscreen;
      if (fsFn) {
        try { fsFn.call(player); } catch (e) {}
      }
      const p = player.play();
      if (p && p.catch) {
        p.catch(() => { player.controls = true; });
      }
    }

    function stopVideo() {
      try { player.pause(); } catch (e) {}
      player.removeAttribute('src');
      try { player.load(); } catch (e) {}
      player.classList.remove('active');
      // Exit native fullscreen if active
      const exitFn = document.exitFullscreen
                  || document.webkitExitFullscreen
                  || document.mozCancelFullScreen
                  || document.msExitFullscreen;
      if (exitFn && (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement)) {
        try { exitFn.call(document); } catch (e) {}
      }
    }

    // Click on player toggles play/pause
    player.addEventListener('click', () => {
      if (player.paused) {
        player.play().catch(() => {});
      } else {
        player.pause();
      }
    });

    // Stop video when user exits native fullscreen (via ESC or browser button)
    function fsChange() {
      const inFs = document.fullscreenElement
                || document.webkitFullscreenElement
                || document.mozFullScreenElement
                || document.msFullscreenElement;
      if (!inFs && player.classList.contains('active')) stopVideo();
    }
    document.addEventListener('fullscreenchange', fsChange);
    document.addEventListener('webkitfullscreenchange', fsChange);
    document.addEventListener('mozfullscreenchange', fsChange);
    document.addEventListener('MSFullscreenChange', fsChange);

    // ESC always stops video if active
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && player.classList.contains('active')) {
        stopVideo();
      }
    });

    // Also stop on video ended
    player.addEventListener('ended', stopVideo);

    async function load() {
      const grid = document.getElementById('grid');
      const cached = (() => { try { return JSON.parse(localStorage.getItem('sexy.v') || 'null'); } catch (e) { return null; } })();
      // Try network first; fall back to cache if Worker fails (adblocker, 503, offline)
      let data = null;
      try {
        const r = await fetch(`${WORKER}/m?_=${Date.now()}`, { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          if (Array.isArray(d.videos) && d.videos.length) {
            data = d.videos;
            try { localStorage.setItem('sexy.v', JSON.stringify({ ts: Date.now(), videos: d.videos })); } catch (e) {}
          }
        }
      } catch (e) {
        // network failed; use cache
      }
      if (!data && cached && Array.isArray(cached.videos) && cached.videos.length) {
        data = cached.videos;
      }
      if (data) {
        state.videos = data;
        state.view = state.videos.slice().sort((a, b) => parseInt(b.id) - parseInt(a.id));
        render();
      } else {
        grid.innerHTML = '<div class="empty">No videos available. Please disable ad-blocker and reload.</div>';
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      const list = state.view;
      if (!list.length) {
        grid.innerHTML = '<div class="empty">No videos match.</div>';
        return;
      }
      const AD_ZONE = 'dc3ee389415a7378d67f2c9dbaae6681';
      grid.innerHTML = list.map((v, i) => {
        // Insert ad slot every 11th item (after 10 videos)
        const adSlot = (i > 0 && (i + 1) % 11 === 0)
          ? `<div class="ad-slot"><div id="container-${AD_ZONE}"></div></div>`
          : '';
        return `
        <div class="card" data-i="${i}">
          <img src="${thumb(v)}" loading="lazy" referrerpolicy="no-referrer"
               onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${thumbStd(v)}'}" />
          ${v.duration ? `<div class="duration">${fmtDur(v.duration)}</div>` : ''}
          <div class="play-icon">${playIconSVG()}</div>
          <div class="title-bar">${(v.title || '').replace(/</g,'&lt;')}</div>
        </div>${adSlot}`;
      }).join('');
      grid.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => playVideo(list[+card.dataset.i]));
      });
      // Load Adsterra script once per page (only if not already loaded)
      injectAdsterra();
    }

    // Initialize both Adsterra ad formats on page load
    function initAds() {
      // Render native banner ad slots first
      // (happens inside render() above via injectAdsterra())
      // Then load Social Bar + Popunder
      injectSocialBar();
      injectPopunder();
    }

    // Adsterra Native Banner — same zone ID on every container, invoke.js fills them all
    function injectAdsterra() {
      if (document.querySelector('script[data-adsterra-loaded]')) return;
      const s = document.createElement('script');
      s.async = true;
      s.setAttribute('data-cfasync', 'false');
      s.src = 'https://pl31233689.profitableratecpmnetwork.com/dc3ee389415a7378d67f2c9dbaae6681/invoke.js';
      s.setAttribute('data-adsterra-loaded', '1');
      document.body.appendChild(s);
    }

    // Adsterra Social Bar — sticky widget at browser edge
    function injectSocialBar() {
      if (document.querySelector('script[data-adsterra-social]')) return;
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://pl31233688.profitableratecpmnetwork.com/84/df/47/84df476cc30f67daa1daf2ecec11a31f.js';
      s.setAttribute('data-adsterra-social', '1');
      document.body.appendChild(s);
    }

    // Adsterra Popunder — opens background tab on page load
    function injectPopunder() {
      if (document.querySelector('script[data-adsterra-popunder]')) return;
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://pl31233686.profitableratecpmnetwork.com/0a/30/41/0a304128ddc8430364138638509b06b7.js';
      s.setAttribute('data-adsterra-popunder', '1');
      // Load after a slight delay so first paint is not interrupted
      setTimeout(() => document.body.appendChild(s), 1500);
    }

    let st;
    searchInput.addEventListener('input', (e) => {
      const v = e.target.value.trim();
      searchWrap.classList.toggle('has-value', v.length > 0);
      clearTimeout(st);
      st = setTimeout(() => {
        const q = v.toLowerCase();
        state.view = state.videos
          .filter(x => !q || (x.title && x.title.toLowerCase().includes(q)))
          .sort((a, b) => parseInt(b.id) - parseInt(a.id));
        render();
      }, 160);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      searchWrap.classList.remove('has-value');
      state.view = state.videos.slice().sort((a, b) => parseInt(b.id) - parseInt(a.id));
      render();
    });

    load();
    initAds();
  })();
  </script>
