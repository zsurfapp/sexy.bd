<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sexy.bd</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 800;
      background: linear-gradient(90deg, #ff6a00, #ee0979);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
    }
    p.tag {
      margin-top: 16px;
      font-size: 1.1rem;
      opacity: 0.85;
      letter-spacing: 1px;
    }
    a.btn {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 28px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    a.btn:hover {
      background: #fff;
      color: #24243e;
    }
    footer {
      position: absolute;
      bottom: 16px;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <h1>sexy.bd</h1>
  <p class="tag">Coming soon — placeholders look this good.</p>
  <a class="btn" href="https://github.com/zsurfapp/sexy.bd" target="_blank" rel="noopener">View Repo</a>
  <footer>© 2026 zsurfapp</footer>
</body>
</html>
